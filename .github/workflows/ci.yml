name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Quality gate
        run: sh scripts/check.sh
      - name: Generate and independently replay artifacts
        run: |
          target/release/voice-runtime run --scenario all --output output
          target/release/voice-runtime replay output/C/trace.jsonl --output output/replay
          target/release/voice-runtime wav tests/fixtures/speech16.wav --script tests/fixtures/wav-script.json --output output/wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-runtime-${{ matrix.os }}
          path: |
            target/release/voice-runtime
            output/
            tests/fixtures/LICENSE.libfvad
          if-no-files-found: error
  quality-gate:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test '${{ needs.checks.result }}' = success
