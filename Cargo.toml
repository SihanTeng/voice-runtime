[package]
name = "voice-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A deterministic, interruptible single-session voice runtime"
license = "MIT"

[features]
default = []
real-vad = ["dep:webrtc-vad"]

[dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "test-util", "signal"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
clap = { version = "4.6.6", features = ["derive"] }
hound = "3.5.1"
webrtc-vad = { version = "0.4.0", optional = true }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

